<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float小手机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:system-ui}
.phone{width:320px;height:640px;border:12px solid #222;border-radius:40px;margin:30px auto;overflow:hidden;position:relative;background:#000}
.screen{width:100%;height:100%;overflow:auto;padding:10px}
.status{height:24px;background:#222;text-align:center;font-size:12px;line-height:24px}
</style>
</head>
<body>
<div class="phone">
  <div class="status">12:59</div>
  <div class="screen">
    <h2>Float小手机</h2>
    <p>部署成功！</p>
  </div>
</div>
</body>
</html>
